site_name: BeeApiary — ваги з GSM, Wi-Fi та Bluetooth
site_description: Документація застосунку та пристрою BeeApiary
site_url: https://ivan-bdgilko.github.io/BeeApiary_Docs/
repo_url: https://github.com/Ivan-Bdgilko/BeeApiary_Docs
repo_name: Ivan-Bdgilko/BeeApiary_Docs
docs_dir: docs
site_dir: site

hooks:
  - hooks/sitemap.py
  - hooks/privacy_compat.py

theme:
  name: material
  custom_dir: overrides
  favicon: assets/common/brand/beeapiary-emblem.png
  logo: assets/common/brand/beeapiary-emblem.png
  language: uk
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy

plugins:
  - privacy:
      links: false
      assets_include:
        - fonts.googleapis.com/*
        - fonts.gstatic.com/*
  - search:
      lang:
        - uk
        - pt
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: uk
          name: Українська
          default: true
          build: true
          site_name: BeeApiary — ваги з GSM, Wi-Fi та Bluetooth
          site_description: Документація застосунку та пристрою BeeApiary
          admonition_translations:
            note: Примітка
            warning: Увага
            danger: Небезпека
