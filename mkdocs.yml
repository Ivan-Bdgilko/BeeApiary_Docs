            HIVE*.XML — налаштування вулика: HIVE*.XML — Beuteneinstellungen
            Відновлення конфігурації: Konfiguration wiederherstellen
            Система: System
            Як працює система: So funktioniert das System
            Потік даних: Datenfluss
            Отримання даних у застосунку: Daten in der App empfangen
            GSM та SMS: GSM und SMS
            Wi-Fi-з'єднання пристрою: WLAN-Verbindung des Geräts
            Синхронізація часу: Zeitsynchronisierung
            Зберігання даних: Datenspeicherung
            Журнали: Protokolle
            Практичні інструкції: Anleitungen
            Налаштувати пристрій: Gerät einrichten
            Налаштувати GSM: GSM konfigurieren
            Налаштувати локальну мережу Wi-Fi: Lokales WLAN konfigurieren
            Завантажити архів: Archiv herunterladen
            Тарувати ваги: Waage tarieren
            Калібрувати ваги: Waage kalibrieren
            Оновити пристрій: Gerät aktualisieren
            Оновити застосунок: App aktualisieren
            Усунення проблем: Fehlerbehebung
